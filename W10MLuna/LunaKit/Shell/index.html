<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1">
<title>Lunacy</title>
<!-- W10MLuna's shell: the Luna shell drawn in the one WebView every webOS window lives in as a
     frame (SHELL.md). AndroidLuna draws the same parts with Android views (shell/). -->
<link rel="stylesheet" href="shell.css">
</head>
<body>
<div id="wallpaper"></div>
<div id="cards"></div>
<div id="dock">
	<div id="dock-items"></div>
</div>
<div id="hidden"></div>
<div id="notifications">
	<div id="dashboards"></div>
	<div id="notification-bar"></div>
</div>
<div id="popups"></div>
<div id="launcher">
	<div id="tabs"><div id="tabs-row"></div></div>
	<div id="pages"><div id="pages-row"></div></div>
</div>
<div id="edge"></div>
<script src="shell.js"></script>
</body>
</html>
